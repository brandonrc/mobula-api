name: Generate & publish SDKs

# Generates the SDKs from openapi.json with openapi-generator (Mustache
# templates; per-language config under sdk/<lang>/config.yaml, overrides in
# sdk/<lang>/templates/) and publishes them. Nothing generated is committed.
# Dev versioning: 0.1.<run_number>.
on:
  push:
    branches: [main]
    paths:
      - "openapi.json"
      - "sdk/**"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OPENAPI_GENERATOR_VERSION: v7.12.0

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@brandonrc"
      - name: Generate TS SDK
        run: |
          docker run --rm -v "$PWD:/local" \
            openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION} generate \
            -i /local/openapi.json -g typescript-fetch \
            -c /local/sdk/typescript/config.yaml \
            -t /local/sdk/typescript/templates \
            -o /local/build/typescript \
            --additional-properties=npmVersion=0.1.${GITHUB_RUN_NUMBER}
      - name: Publish to GitHub Packages
        working-directory: build/typescript
        run: |
          npm install --no-audit --no-fund
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust SDK
        run: |
          docker run --rm -v "$PWD:/local" \
            openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION} generate \
            -i /local/openapi.json -g rust \
            -c /local/sdk/rust/config.yaml \
            -t /local/sdk/rust/templates \
            -o /local/build/rust \
            --additional-properties=packageVersion=0.1.${GITHUB_RUN_NUMBER}
      - name: Build (validate)
        working-directory: build/rust
        run: cargo build
      - name: Publish to crates.io (only if token set)
        working-directory: build/rust
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set — built but not published."
            exit 0
          fi
          cargo publish --allow-dirty --token "$CARGO_TOKEN"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Python SDK
        run: |
          docker run --rm -v "$PWD:/local" \
            openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION} generate \
            -i /local/openapi.json -g python \
            -c /local/sdk/python/config.yaml \
            -t /local/sdk/python/templates \
            -o /local/build/python \
            --additional-properties=packageVersion=0.1.${GITHUB_RUN_NUMBER}
      - name: Build wheel (validate)
        working-directory: build/python
        run: |
          pip install --quiet build
          python -m build
      - name: Publish to PyPI (only if token set)
        working-directory: build/python
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::notice::PYPI_API_TOKEN not set — built but not published."
            exit 0
          fi
          pip install --quiet twine
          twine upload -u __token__ -p "$PYPI_TOKEN" dist/*
