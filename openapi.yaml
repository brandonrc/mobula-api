openapi: 3.1.0
info:
  title: Mobula
  description: "FOSS control plane for Ray clusters. All endpoints take a Bearer JWT\
    \ (OIDC). Note: the Ray Jobs API is NOT documented here \u2014 it is served by\
    \ hostname, each registered cluster's hostname proxying Ray's own /api/jobs/ surface\
    \ through the federating gateway. This spec covers Mobula's own control-plane\
    \ routes."
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /api/v1/audit:
    get:
      tags:
      - audit
      summary: "List the persisted audit trail, Admin-only (api-v1.md \xA75.9)."
      operationId: list_audit_events
      parameters:
      - name: limit
        in: query
        description: Page size (default 100, max 1000).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: cursor
        in: query
        description: 'Only rows with `seq` strictly before this value (from a previous

          response''s `next_cursor`).'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: from
        in: query
        description: Window start, unix seconds (inclusive).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: to
        in: query
        description: Window end, unix seconds (inclusive).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: subject
        in: query
        description: Exact subject match.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: cluster
        in: query
        description: Exact cluster id match.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: method
        in: query
        description: Exact HTTP method match (e.g. `POST`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: path_prefix
        in: query
        description: Rows whose path starts with this prefix.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: min_status
        in: query
        description: Only rows with `status` >= this (status-less rows excluded).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: decision
        in: query
        description: '`allow` or `deny`.'
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuditDecision'
      - name: reason
        in: query
        description: Exact reason match (e.g. `insufficient_permission`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: format
        in: query
        description: '`csv` exports the page as `text/csv`; anything else is a 400.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Audit events, newest first. `?format=csv` returns text/csv
            instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '400':
          description: Bad query (e.g. from > to, unknown format)
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 audit subjects are Admin data"
      security:
      - bearer: []
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 'Username/password login (ADR-0011). Public (allowlisted); rate-limited

        by bcrypt cost and the 5-strikes/5-minute account lockout.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Logged in; opaque bearer token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials (identical body for unknown user, wrong
            password, locked, or disabled)
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: "Log out: if the caller authenticated with a PAT, revoke it; otherwise\
        \ a\n204 no-op (JWTs are stateless \u2014 there is nothing server-side to\
        \ kill)."
      operationId: logout
      responses:
        '204':
          description: Logged out (PAT revoked when one was used)
        '401':
          description: No/invalid token
      security:
      - bearer: []
  /api/v1/auth/providers:
    get:
      tags:
      - auth
      summary: 'Login-page metadata: which providers are configured. Public by design.'
      operationId: providers
      responses:
        '200':
          description: Configured auth providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
  /api/v1/auth/tokens:
    get:
      tags:
      - auth
      summary: List the caller's own tokens. Hashes are never serialized.
      operationId: list_tokens
      responses:
        '200':
          description: The caller's tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenView'
        '401':
          description: No/invalid token
      security:
      - bearer: []
    post:
      tags:
      - auth
      summary: 'Mint a personal access token for the caller (ADR-0011). Any

        authenticated identity; the plaintext is shown once.'
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
        required: true
      responses:
        '201':
          description: Token created; plaintext returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          description: expires_in_days out of range
        '401':
          description: No/invalid token
      security:
      - bearer: []
  /api/v1/auth/tokens/{prefix}:
    delete:
      tags:
      - auth
      summary: "Revoke one of the caller's own tokens. Someone else's token (or a\n\
        nonexistent prefix) is a 404 \u2014 ownership can't be probed."
      operationId: revoke_token
      parameters:
      - name: prefix
        in: path
        description: The token's 8-char lookup prefix
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked
        '401':
          description: No/invalid token
        '404':
          description: No such token for this caller
      security:
      - bearer: []
  /api/v1/clusters:
    get:
      tags:
      - clusters
      operationId: list_clusters
      responses:
        '200':
          description: All managed clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
      security:
      - bearer: []
    post:
      tags:
      - clusters
      operationId: create_cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCluster'
        required: true
      responses:
        '201':
          description: Desired state recorded; reconciler will converge
        '400':
          description: Invalid spec (bad quantity, min>max)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on cluster (Operator/Admin only)
        '409':
          description: Project quota exceeded
        '500':
          description: Store/quota-accounting failure
      security:
      - bearer: []
  /api/v1/clusters/{id}:
    get:
      tags:
      - clusters
      operationId: get_cluster
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
        '404':
          description: No such cluster
      security:
      - bearer: []
    delete:
      tags:
      - clusters
      operationId: delete_cluster
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Marked for termination; reconciler tears it down
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on cluster (Operator/Admin only)
        '404':
          description: No such cluster
      security:
      - bearer: []
  /api/v1/jobs:
    get:
      tags:
      - jobs
      operationId: list_jobs
      responses:
        '200':
          description: Persistent job history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on job
      security:
      - bearer: []
  /api/v1/metrics:
    get:
      tags:
      - usage
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition of usage gauges
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
      security:
      - bearer: []
  /api/v1/pools:
    get:
      tags:
      - pools
      operationId: list_pools
      responses:
        '200':
          description: All capacity pools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
      security:
      - bearer: []
    post:
      tags:
      - pools
      operationId: create_pool
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePool'
        required: true
      responses:
        '201':
          description: Pool created
        '400':
          description: Invalid spec (bad name, no flavors, unparseable quantity)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on pool (Admin only)
        '409':
          description: Pool already exists (create-only in v0; spec update lands with
            a later PATCH)
      security:
      - bearer: []
  /api/v1/pools/{name}:
    get:
      tags:
      - pools
      operationId: get_pool
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
        '404':
          description: No such pool
      security:
      - bearer: []
    delete:
      tags:
      - pools
      operationId: delete_pool
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Pool deleted
        '401':
          description: No/invalid token
        '403':
          description: Missing Delete on pool (Admin only)
        '404':
          description: No such pool
      security:
      - bearer: []
  /api/v1/pools/{name}/allocations:
    get:
      tags:
      - pools
      operationId: list_allocations
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The pool's allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllocationSpec'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
      security:
      - bearer: []
  /api/v1/pools/{name}/allocations/{project}:
    put:
      tags:
      - pools
      operationId: put_allocation
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAllocation'
        required: true
      responses:
        '200':
          description: Allocation recorded
        '400':
          description: Invalid allocation, or body pool/project mismatches the path
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on pool (Admin only)
        '404':
          description: No such pool
      security:
      - bearer: []
    delete:
      tags:
      - pools
      operationId: delete_allocation
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Allocation deleted
        '401':
          description: No/invalid token
        '403':
          description: Missing Delete on pool (Admin only)
        '404':
          description: No such allocation
      security:
      - bearer: []
  /api/v1/pools/{name}/usage:
    get:
      tags:
      - pools
      operationId: pool_usage
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Live pool utilization (latest observation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolUsageView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
        '404':
          description: No such pool
      security:
      - bearer: []
  /api/v1/registry/clusters:
    get:
      tags:
      - registry
      operationId: list_registry
      responses:
        '200':
          description: The gateway's routing table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistryEntryView'
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 the registry is the credential-routing table"
      security:
      - bearer: []
  /api/v1/services:
    get:
      tags:
      - services
      operationId: list_services
      responses:
        '200':
          description: All managed services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on service
      security:
      - bearer: []
    post:
      tags:
      - services
      operationId: deploy_service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployService'
        required: true
      responses:
        '202':
          description: Deploy accepted; KubeRay rolls it out
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on service (Developer/Admin only)
        '502':
          description: Service backend error
      security:
      - bearer: []
  /api/v1/services/{name}:
    get:
      tags:
      - services
      operationId: get_service
      parameters:
      - name: name
        in: path
        description: Service name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on service
        '404':
          description: No such service
      security:
      - bearer: []
    delete:
      tags:
      - services
      operationId: delete_service
      parameters:
      - name: name
        in: path
        description: Service name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Teardown accepted
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on service (Developer/Admin only)
      security:
      - bearer: []
  /api/v1/usage:
    get:
      tags:
      - usage
      operationId: usage_report
      parameters:
      - name: project
        in: query
        description: Filter to one project.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: pool
        in: query
        description: Filter to one pool.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: from
        in: query
        description: 'Window start, unix seconds (default: `to - 86400`).'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: to
        in: query
        description: 'Window end, unix seconds (default: now).'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      responses:
        '200':
          description: Resource-hours (and cost when priced) by project and pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          description: from must be before to
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
      security:
      - bearer: []
  /api/v1/version:
    get:
      tags:
      - system
      summary: Control-plane identity and version.
      operationId: version
      responses:
        '200':
          description: Name and semver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /healthz:
    get:
      tags:
      - system
      summary: Liveness/readiness probe.
      operationId: healthz
      responses:
        '200':
          description: Control plane is up
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    AllocationSpec:
      type: object
      description: 'A project''s allocation within a pool (translates to a Kueue LocalQueue).


        `nominal` / `borrowing_limit` / `lending_limit` are reserved for a future

        per-project ClusterQueue layout (ADR-0010): in the v0 layout all

        allocations in a pool share one ClusterQueue, so these are recorded as

        LocalQueue annotations rather than enforced quotas.'
      required:
      - pool
      - project
      - namespace
      - nominal
      - borrowing_limit
      - lending_limit
      properties:
        borrowing_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        lending_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        namespace:
          type: string
        nominal:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pool:
          type: string
        project:
          type: string
    ApiTokenView:
      type: object
      description: "The public projection of an API token \u2014 no hash, no plaintext."
      required:
      - prefix
      - username
      - label
      - created_at
      - expires_at
      - revoked
      properties:
        created_at:
          type: integer
          format: int64
          minimum: 0
        expires_at:
          type: integer
          format: int64
          minimum: 0
        label:
          type: string
        last_used_at:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        prefix:
          type: string
        revoked:
          type: boolean
        username:
          type: string
    AuditDecision:
      type: string
      description: 'Whether Mobula allowed or refused the thing the event describes.

        Serialized snake_case (`allow` / `deny`).'
      enum:
      - allow
      - deny
    AuditEvent:
      type: object
      description: "One audit-trail row (api-v1.md \xA75.9). Fields not applicable\
        \ to the\nemitting site are `None` (serialized `null`); `granted_roles` is\
        \ empty.\n\nDecision policy (mobula-api `audit` module): `deny` rows are emitted\
        \ at\nthe point of refusal (authn failures, authz denials, quota denials);\n\
        gateway per-request rows are always `allow` \u2014 a request Mobula refuses\n\
        never reaches the gateway, so its `deny` row comes from the refuser."
      required:
      - ts
      - decision
      properties:
        action:
          type:
          - string
          - 'null'
          description: "Control-plane mutation (`create_cluster`, `delete_pool`, \u2026\
            );\n`null` on gateway rows."
        cluster:
          type:
          - string
          - 'null'
          description: Cluster id the event concerns; `null` when not cluster-scoped.
        decision:
          $ref: '#/components/schemas/AuditDecision'
        granted_roles:
          type: array
          items:
            type: string
          description: Roles the caller held (snake_case); authz denials only, else
            `[]`.
        latency_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Gateway upstream round-trip; `null` elsewhere.
          minimum: 0
        method:
          type:
          - string
          - 'null'
          description: HTTP method, for gateway and authn/ext_authz rows.
        path:
          type:
          - string
          - 'null'
          description: Request path (no query string).
        reason:
          type:
          - string
          - 'null'
          description: 'Machine-readable refusal reason (`missing_token`, `invalid_token`,

            `insufficient_permission`, `quota_exceeded`); `null` on allows.'
        required:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuditRequired'
            description: The permission an authz denial was checked against.
        status:
          type:
          - integer
          - 'null'
          format: int32
          description: HTTP status of the outcome, when one is known.
          minimum: 0
        subject:
          type:
          - string
          - 'null'
          description: Authenticated subject; `null` for authn failures (no identity
            yet).
        ts:
          type: integer
          format: int64
          description: Unix seconds.
          minimum: 0
    AuditListResponse:
      type: object
      description: "Response of `GET /api/v1/audit`. This endpoint is the ONE list\
        \ route\nthat wraps its items in an envelope \u2014 the cursor has to live\
        \ somewhere\n(api-v1.md \xA75.9)."
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type:
          - integer
          - 'null'
          format: int64
          description: Pass as `cursor` for the next (older) page; `null` at the end.
          minimum: 0
    AuditRequired:
      type: object
      description: "The (verb, target) permission an authorization decision was checked\n\
        against \u2014 mirrors `mobula_auth::{PermissionType, Target}` as lowercase\n\
        strings (`\"write\"`, `\"cluster\"`) so core stays free of auth types.\nPresent\
        \ only on authz denials."
      required:
      - action
      - target
      properties:
        action:
          type: string
          description: e.g. "read" | "write" | "delete" | "admin".
        target:
          type: string
          description: e.g. "job" | "cluster" | "service" | "pool".
    ClusterSpec:
      type: object
      description: 'Declarative spec for a managed Ray cluster.


        v0 targets the KubeRay backend only; fields deliberately mirror what maps

        onto a RayCluster CR so the provisioner stays a thin translation.'
      required:
      - name
      - project
      - ray_version
      - image
      - head_cpu
      - head_memory
      - worker_groups
      properties:
        head_cpu:
          type: string
        head_memory:
          type: string
        image:
          type: string
        name:
          type: string
        project:
          type: string
        ray_version:
          type: string
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Idle TTL in seconds; `None` disables reaping.
          minimum: 0
        worker_groups:
          type: array
          items:
            $ref: '#/components/schemas/WorkerGroup'
    ClusterState:
      type: string
      description: "Lifecycle states of a managed cluster (PLAN.md \xA73.1)."
      enum:
      - pending
      - provisioning
      - running
      - degraded
      - updating
      - suspending
      - suspended
      - terminating
      - terminated
    ClusterView:
      type: object
      description: 'A cluster as the control plane sees it: desired spec metadata
        plus the

        last observed state (reconstructed from the provisioner, ADR-0006).'
      required:
      - id
      - generation
      - desired
      - observed_generation
      - project
      - ray_version
      properties:
        condition:
          type:
          - string
          - 'null'
          description: 'Drift/health alarm raised by the reconcile engine (ADR-0004,
            #41/#47):

            "spec_drift" (out-of-band edit) or "degraded". `None` when converging

            normally. Distinct from `observed_state`.'
        desired:
          type: string
          description: "\"running\" | \"terminated\" \u2014 the operator's intent."
        est_max_hourly:
          type:
          - number
          - 'null'
          format: double
          description: Estimated $/hr at max (fully scaled) size.
        est_min_hourly:
          type:
          - number
          - 'null'
          format: double
          description: Estimated $/hr at min size, if a price sheet is configured.
        generation:
          type: integer
          format: int64
          description: Bumps when the spec changes; drives the reconcile idempotency
            key.
          minimum: 0
        id:
          type: string
        observed_generation:
          type: integer
          format: int64
          minimum: 0
        observed_state:
          type:
          - string
          - 'null'
          description: Observed lifecycle state, if the cluster has been reconciled.
        project:
          type: string
        ray_version:
          type: string
    CreateCluster:
      type: object
      description: Request body for creating/updating a managed cluster.
      required:
      - id
      - spec
      properties:
        id:
          type: string
          description: Stable cluster id (also the gateway routing key / RayCluster
            name).
        spec:
          $ref: '#/components/schemas/ClusterSpec'
    CreatePool:
      type: object
      description: Request body for creating a pool.
      required:
      - spec
      properties:
        spec:
          $ref: '#/components/schemas/PoolSpec'
    CreateTokenRequest:
      type: object
      required:
      - label
      - expires_in_days
      properties:
        expires_in_days:
          type: integer
          format: int64
          description: Lifetime in days; capped at the server maximum (90).
          minimum: 0
        label:
          type: string
          description: "Human label (\"ci\", \"laptop\") \u2014 shown in listings."
    CreateTokenResponse:
      type: object
      description: "`POST /api/v1/auth/tokens` success body. The plaintext `token`\
        \ is\nreturned ONLY here \u2014 store it now; it cannot be recovered."
      required:
      - prefix
      - token
      - expires_at
      properties:
        expires_at:
          type: integer
          format: int64
          description: Unix seconds.
          minimum: 0
        prefix:
          type: string
        token:
          type: string
    DeployService:
      type: object
      description: Request body to deploy or update a service.
      required:
      - name
      - spec
      properties:
        name:
          type: string
          description: Stable service name (the RayService name).
        spec:
          $ref: '#/components/schemas/ServiceSpec'
    FlavorSpec:
      type: object
      description: 'A hardware flavor within a pool: node selection plus per-resource

        nominal quota (K8s quantity strings, e.g. "4", "512Gi").'
      required:
      - name
      - resources
      - node_labels
      - taints
      properties:
        name:
          type: string
        node_labels:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        resources:
          type: object
          description: "Resource key \u2192 nominal quota quantity string."
          additionalProperties:
            type: string
          propertyNames:
            type: string
        taints:
          type: array
          items:
            $ref: '#/components/schemas/TaintSpec'
    JobView:
      type: object
      description: "A job in the persistent, cross-cluster history (Phase 3, spec\
        \ \xA75.5)."
      required:
      - id
      - cluster
      - submitter
      - status
      - submitted_at
      properties:
        cluster:
          type: string
        duration_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: Wall-clock seconds once terminal; null while running.
          minimum: 0
        id:
          type: string
        status:
          type: string
          description: Ray job status (PENDING | RUNNING | SUCCEEDED | FAILED | STOPPED).
        submitted_at:
          type: integer
          format: int64
          minimum: 0
        submitter:
          type: string
    LocalRole:
      type: string
      description: "A local user's role (ADR-0011: roles are a column on the user,\
        \ resolved\nper request \u2014 no claim staleness). Stored as TEXT in `local_users.role`;\n\
        the vocabulary mirrors `mobula_auth::Role` (kept as a separate enum so\ncore\
        \ never depends on the auth crate)."
      enum:
      - viewer
      - developer
      - operator
      - admin
    LoginIdentity:
      type: object
      description: The identity half of a login response.
      required:
      - subject
      - roles
      properties:
        roles:
          type: array
          items:
            type: string
        subject:
          type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    LoginResponse:
      type: object
      description: "`POST /api/v1/auth/login` success body. `token` is an opaque\n\
        `mob_\u2026` bearer credential (ADR-0011: stored, never signed)."
      required:
      - token
      - token_type
      - expires_at
      - identity
      properties:
        expires_at:
          type: integer
          format: int64
          description: Unix seconds after which the token no longer authenticates.
          minimum: 0
        identity:
          $ref: '#/components/schemas/LoginIdentity'
        token:
          type: string
        token_type:
          type: string
          description: Always "bearer".
          example: bearer
    OidcProviderInfo:
      type: object
      required:
      - issuer
      properties:
        issuer:
          type: string
    PoolSpec:
      type: object
      description: 'A shared capacity pool: flavors + a cohort to borrow from (ADR-0010).'
      required:
      - name
      - flavors
      - cohort
      - fair_sharing_weight
      - elastic
      properties:
        cohort:
          type: string
          description: 'Name of the Kueue cohort this pool''s ClusterQueue joins for
            elastic

            borrowing.'
        elastic:
          type: boolean
          description: 'Whether workloads in this pool may be elastically resized
            (Kueue

            elastic jobs / Workload Slices).'
        fair_sharing_weight:
          type: number
          format: double
          description: Kueue `spec.fairSharing.weight` for the pool's ClusterQueue.
        flavors:
          type: array
          items:
            $ref: '#/components/schemas/FlavorSpec'
        name:
          type: string
    PoolUsageView:
      type: object
      description: "Live point-in-time usage of one pool (Slice 4): built from the\
        \ pool's\nlatest stored ClusterQueue/LocalQueue observation plus the spec's\n\
        nominal quotas. NOT a timeseries \u2014 for history use `GET /api/v1/usage`.\n\
        `projects` is the per-LocalQueue (per-project) attribution; empty when\nthe\
        \ observation predates per-LQ status or none exists."
      required:
      - pool
      - utilization
      - projects
      properties:
        pool:
          type: string
        projects:
          type: object
          description: "project \u2192 resource \u2192 allocated quantity."
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              format: double
            propertyNames:
              type: string
          propertyNames:
            type: string
        sampled_at:
          type:
          - integer
          - 'null'
          format: int64
          description: 'When the observation was recorded (unix seconds); `null` until
            the

            pool reconcile loop has observed this pool.'
          minimum: 0
        utilization:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceUtilization'
          propertyNames:
            type: string
    PoolView:
      type: object
      description: 'A pool as the control plane serves it: the stored spec metadata
        plus

        `total_nominal`, the per-resource sum of all flavors'' nominal quotas.'
      required:
      - name
      - generation
      - created_at
      - flavors
      - cohort
      - fair_sharing_weight
      - elastic
      - total_nominal
      properties:
        cohort:
          type: string
        created_at:
          type: integer
          format: int64
          minimum: 0
        elastic:
          type: boolean
        fair_sharing_weight:
          type: number
          format: double
        flavors:
          type: array
          items:
            $ref: '#/components/schemas/FlavorSpec'
        generation:
          type: integer
          format: int64
          description: Bumps when the spec changes (same convention as clusters).
          minimum: 0
        name:
          type: string
        total_nominal:
          type: object
          description: "Resource key \u2192 summed nominal quota across flavors, as\
            \ a string.\nA resource key whose quantity fails to parse on ANY flavor\
            \ is\nomitted entirely (a partial sum would misreport capacity); the\n\
            failure is logged. Display math only \u2014 the spec stays authoritative."
          additionalProperties:
            type: string
          propertyNames:
            type: string
    ProvidersResponse:
      type: object
      description: "Which auth providers this deployment offers (login-page metadata;\
        \ not\nsensitive \u2014 the endpoint is public by design)."
      required:
      - local
      properties:
        local:
          type: boolean
          description: Local username/password auth is enabled (ADR-0011).
        oidc:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OidcProviderInfo'
            description: OIDC configuration, when a validator is configured.
    PutAllocation:
      type: object
      description: 'Request body for putting an allocation: `AllocationSpec` minus

        `pool`/`project`, which come from the path. If the body still carries

        them, they must match the path or the request is rejected.'
      required:
      - namespace
      - nominal
      - borrowing_limit
      - lending_limit
      properties:
        borrowing_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        lending_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        namespace:
          type: string
        nominal:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pool:
          type:
          - string
          - 'null'
        project:
          type:
          - string
          - 'null'
    RegistryEntryView:
      type: object
      description: 'A gateway routing entry as the control plane may show it: where
        a

        cluster is exposed and where its dashboard head lives, but never the

        token itself (ADR-0003, security issue #4).'
      required:
      - id
      - hostname
      - api_base_url
      - token_set
      properties:
        api_base_url:
          type: string
        hostname:
          type: string
        id:
          type: string
        token_set:
          type: boolean
          description: Whether the gateway holds a static Ray token for this cluster.
        validation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RegistryValidation'
            description: 'Reserved for per-entry validation/reachability checks. Always
              null

              today: registry validation is fail-fast at startup, so every served

              entry is valid by construction.'
    RegistryValidation:
      type: object
      description: Placeholder shape for future per-entry health/validation results.
      required:
      - ok
      properties:
        checked_at:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        ok:
          type: boolean
    ResourceUtilization:
      type: object
      description: "One resource's live utilization within a pool: `allocated` is\
        \ the Kueue\nreservation-ledger total (summed across flavors from the latest\n\
        ClusterQueue observation), `nominal` the summed flavor quotas from the\nspec,\
        \ `pct` = allocated / nominal \xD7 100 (0 when nominal is 0 \u2014 a\npercentage\
        \ of nothing is undefined, and 0 keeps the type non-optional)."
      required:
      - allocated
      - nominal
      - pct
      properties:
        allocated:
          type: number
          format: double
        nominal:
          type: number
          format: double
        pct:
          type: number
          format: double
    ServiceSpec:
      type: object
      description: Declarative spec for a managed Serve service.
      required:
      - name
      - project
      - ray_version
      - image
      - serve_config_v2
      - head_cpu
      - head_memory
      - worker_replicas
      - worker_cpu
      - worker_memory
      properties:
        head_cpu:
          type: string
        head_memory:
          type: string
        image:
          type: string
        name:
          type: string
        project:
          type: string
        ray_version:
          type: string
        serve_config_v2:
          type: string
          description: "The Serve application config (KubeRay `serveConfigV2`), passed\n\
            through verbatim as a YAML string \u2014 Mobula does not interpret it."
        upgrade:
          $ref: '#/components/schemas/UpgradeStrategy'
        worker_cpu:
          type: string
        worker_memory:
          type: string
        worker_replicas:
          type: integer
          format: int32
          description: 'Fixed worker replicas backing the service (autoscaling of
            Serve

            deployments is Ray Serve''s own concern).'
          minimum: 0
    ServiceView:
      type: object
      required:
      - name
      - state
      properties:
        name:
          type: string
        state:
          type: string
          description: 'Observed lifecycle state: provisioning | running | updating
            | ...'
        url:
          type:
          - string
          - 'null'
          description: External Serve endpoint base URL, when ready.
    TaintSpec:
      type: object
      description: 'A Kubernetes taint on a flavor''s nodes. `effect` is e.g. "NoSchedule";

        validated non-empty here (the set of legal effects is Kubernetes'', not

        ours).'
      required:
      - key
      - value
      - effect
      properties:
        effect:
          type: string
        key:
          type: string
        value:
          type: string
    UpgradeStrategy:
      type: string
      description: How to roll out a new version of a service.
      enum:
      - canary
      - in_place
    UsageGroup:
      type: object
      description: One (project, pool) group of the usage report.
      required:
      - project
      - pool
      - resource_hours
      properties:
        cost_usd:
          type:
          - number
          - 'null'
          format: double
          description: Total cost in USD; `null` when no price sheet is configured.
        pool:
          type: string
          description: Empty string = the project has no allocation.
        project:
          type: string
          description: Empty string = the pool-level aggregate row (Kueue path only).
        resource_hours:
          type: object
          description: "resource \u2192 resource-hours over the window."
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    UsageReport:
      type: object
      description: Response of `GET /api/v1/usage`.
      required:
      - from
      - to
      - groups
      properties:
        from:
          type: integer
          format: int64
          minimum: 0
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UsageGroup'
        to:
          type: integer
          format: int64
          minimum: 0
    VersionInfo:
      type: object
      required:
      - name
      - version
      properties:
        name:
          type: string
          description: Always "mobula".
          example: mobula
        version:
          type: string
          description: Control-plane semver.
          example: 0.0.1
    WorkerGroup:
      type: object
      description: "A homogeneous group of Ray worker nodes.\n\nAutoscaling in v0\
        \ is actuated exclusively through these replica bounds,\nwhich translate to\
        \ KubeRay worker-group fields \u2014 never by reading demand\nfrom GCS (ADR-0002)."
      required:
      - name
      - cpu
      - memory
      - min_replicas
      - max_replicas
      - replicas
      properties:
        cpu:
          type: string
        gpu:
          type:
          - string
          - 'null'
        max_replicas:
          type: integer
          format: int32
          minimum: 0
        memory:
          type: string
        min_replicas:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
        replicas:
          type: integer
          format: int32
          minimum: 0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: system
  description: Health and version probes.
- name: clusters
  description: Cluster lifecycle. Reads need any authenticated role; create/terminate
    need Write on the cluster target (Operator or Admin). Mounted only when the lifecycle
    controller is enabled (`serve --kuberay-namespace`).
- name: services
  description: "Ray Serve services (RayService). Deploy/update/delete need Write on\
    \ the service target (Developer or Admin \u2014 deploying is code); reads are\
    \ open to any authenticated role. KubeRay handles zero-downtime canary rollout."
- name: pools
  description: 'Capacity pools and per-project allocations (ADR-0010): platform configuration,
    not app lifecycle. Reads need any authenticated role; create/delete/allocation
    mutations are Admin-only. Mounted only when a store is configured.'
- name: usage
  description: "Usage metering (Slice 4): resource-hours reports and the Prometheus\
    \ gauge over the metered samples. Reads need Read on the cluster target (Viewer+)\
    \ \u2014 consumption reporting is cluster data, not pool topology. Mounted only\
    \ when a store is configured."
- name: registry
  description: 'The job gateway''s routing table (ADR-0002). Admin-only: it is the
    credential-routing table. Static config today; dynamic registration of managed
    clusters is a follow-up.'
- name: audit
  description: "The persisted audit trail (api-v1.md \xA75.9): every authn/authz decision,\
    \ mutation, and proxied gateway request, newest-first with seq-cursor pagination\
    \ and CSV export. Admin-only \u2014 audit subjects are Admin data. Mounted only\
    \ when a store is configured."
- name: auth
  description: 'Local auth (ADR-0011): username/password login issuing opaque (unsigned)
    bearer tokens, personal access token management, and provider metadata. `login`
    and `providers` are public; token routes are owner-scoped. Mounted only with `serve
    --local-auth` (except `providers`).'
