          type: string
        hostname:
          type: string
        id:
          type: string
        token_set:
          type: boolean
          description: Whether the gateway holds a static Ray token for this cluster.
        validation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RegistryValidation'
            description: 'Reserved for per-entry validation/reachability checks. Always
              null

              today: registry validation is fail-fast at startup, so every served

              entry is valid by construction.'
    RegistryValidation:
      type: object
      description: Placeholder shape for future per-entry health/validation results.
      required:
      - ok
      properties:
        checked_at:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        ok:
          type: boolean
    ResourceStat:
      type: object
      description: "A single resource's capacity, and its used amount when known.\
        \ `used`/\n`total` are in the resource's natural unit: CPU in cores, GPU in\
        \ device\ncount, memory in bytes. `used` is `None` when the cluster does not\
        \ report\nlive utilization (e.g. a non-autoscaling cluster whose Ray dashboard\
