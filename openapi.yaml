          - number
          - 'null'
          format: double
          description: Total cost in USD; `null` when no price sheet is configured.
        pool:
          type: string
          description: Empty string = the project has no allocation.
        project:
          type: string
          description: Empty string = the pool-level aggregate row (Kueue path only).
        resource_hours:
          type: object
          description: "resource \u2192 resource-hours over the window."
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
    UsageReport:
      type: object
      description: Response of `GET /api/v1/usage`.
      required:
      - from
      - to
      - groups
      properties:
        from:
          type: integer
          format: int64
          minimum: 0
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UsageGroup'
        to:
          type: integer
          format: int64
          minimum: 0
    VersionInfo:
      type: object
      required:
      - name
      - version
      properties:
        name:
          type: string
          description: Always "mobula".
          example: mobula
        version:
          type: string
          description: Control-plane semver.
          example: 0.0.1
    WorkerGroup:
      type: object
      description: "A homogeneous group of Ray worker nodes.\n\nAutoscaling in v0\
        \ is actuated exclusively through these replica bounds,\nwhich translate to\
        \ KubeRay worker-group fields \u2014 never by reading demand\nfrom GCS (ADR-0002)."
      required:
      - name
      - cpu
      - memory
      - min_replicas
      - max_replicas
      - replicas
      properties:
        cpu:
          type: string
        gpu:
          type:
          - string
          - 'null'
        max_replicas:
          type: integer
          format: int32
          minimum: 0
        memory:
          type: string
        min_replicas:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
        replicas:
          type: integer
          format: int32
          minimum: 0
    WorkerGroupNodes:
      type: object
      description: "One worker group and its nodes (api-v1.md \xA75.3)."
      required:
      - name
      - desired
      - ready
      - nodes
      properties:
        desired:
          type: integer
          format: int32
          description: 'Desired replicas: the group''s `replicas` field, or `minReplicas`
            when

            autoscaling leaves `replicas` unmanaged (ADR-0007). Per-group desired

            counts are not in the RayCluster status, so this is the spec''s answer.'
          minimum: 0
        name:
          type: string
          description: The worker-group name (`groupName` in the RayCluster spec).
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeView'
          description: The group's nodes.
        ready:
          type: integer
          format: int32
          description: 'Ready replicas: pods in this group that are `Running` and
            `Ready`.'
          minimum: 0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: system
  description: Health and version probes.
- name: clusters
  description: Cluster lifecycle. Reads need any authenticated role; create/terminate
    need Write on the cluster target (Operator or Admin). Mounted only when the lifecycle
    controller is enabled (`serve --kuberay-namespace`).
- name: services
  description: "Ray Serve services (RayService). Deploy/update/delete need Write on\
    \ the service target (Developer or Admin \u2014 deploying is code); reads are\
    \ open to any authenticated role. KubeRay handles zero-downtime canary rollout."
- name: pools
  description: 'Capacity pools and per-project allocations (ADR-0010): platform configuration,
    not app lifecycle. Reads need any authenticated role; create/delete/allocation
    mutations are Admin-only. Mounted only when a store is configured.'
- name: usage
  description: "Usage metering (Slice 4): resource-hours reports and the Prometheus\
    \ gauge over the metered samples. Reads need Read on the cluster target (Viewer+)\
    \ \u2014 consumption reporting is cluster data, not pool topology. Mounted only\
    \ when a store is configured."
- name: settings
  description: "Governance policy management (api-v1.md \xA75.16): the effective price\
    \ sheet and per-project quotas. Admin-only. The `--policy` file is the boot-time\
    \ default; the store row wins once edited via PUT, and every consumer (quota admission,\
    \ cost estimates, usage roll-up) reads the store per request, so edits apply without\
    \ a restart. Mounted only when a store is configured."
- name: registry
  description: 'The job gateway''s routing table (ADR-0002). Admin-only: it is the
    credential-routing table. Static config today; dynamic registration of managed
    clusters is a follow-up.'
- name: audit
  description: "The persisted audit trail (api-v1.md \xA75.9): every authn/authz decision,\
    \ mutation, and proxied gateway request, newest-first with seq-cursor pagination\
    \ and CSV export. Rows are hash-chained for tamper-evidence (#59); `audit/verify`\
    \ replays the chain. Reads need Read on the audit target \u2014 Admin or Auditor\
    \ \u2014 and are themselves audited (`audit_read` rows). Mounted only when a store\
    \ is configured."
- name: auth
  description: 'Local auth (ADR-0011): username/password login issuing opaque (unsigned)
    bearer tokens, personal access token management, provider metadata, and Admin-only
    local user management. `login` and `providers` are public; token routes are owner-scoped;
    user routes are Admin-only. Mounted only with `serve --local-auth` (except `providers`).'
- name: access
  description: "Identity & access (api-v1.md \xA75.8): `identity` is 'who am I' for\
    \ any authenticated caller (the dev identity when auth is disabled); `access/roles`\
    \ is the Admin-only read of the effective role mappings. Mounted unconditionally."
