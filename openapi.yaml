openapi: 3.1.0
info:
  title: Mobula
  description: "FOSS control plane for Ray clusters. All endpoints take a Bearer JWT\
    \ (OIDC). Note: the Ray Jobs API is NOT documented here \u2014 it is served by\
    \ hostname, each registered cluster's hostname proxying Ray's own /api/jobs/ surface\
    \ through the federating gateway. This spec covers Mobula's own control-plane\
    \ routes."
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /api/v1/access/assignments:
    get:
      tags:
      - access
      summary: List every scoped role assignment, Admin-only.
      operationId: list_assignments
      responses:
        '200':
          description: All role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentView'
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 access-control surface (api-v1.md \xA72.2)"
        '503':
          description: No store configured (gateway-only deployment)
      security:
      - bearer: []
  /api/v1/access/assignments/{principal}:
    put:
      tags:
      - access
      summary: "Create or replace one assignment, Admin-only. The role and scope grammar\n\
        are validated here \u2014 the store is dumb persistence."
      operationId: upsert_assignment
      parameters:
      - name: principal
        in: path
        description: "The principal to bind: a token `sub` (Keycloak UUID) or a `preferred_username`\
          \ \u2014 both are matched at evaluation (#88)"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAssignment'
        required: true
      responses:
        '200':
          description: Assignment stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentView'
        '400':
          description: Unknown role or invalid scope grammar
        '401':
          description: No/invalid token
        '403':
          description: Admin only
        '503':
          description: No store configured
      security:
      - bearer: []
    delete:
      tags:
      - access
      summary: Remove one assignment, Admin-only; 404 when the triple doesn't exist.
      operationId: delete_assignment
      parameters:
      - name: principal
        in: path
        description: The Identity subject
        required: true
        schema:
          type: string
      - name: role
        in: query
        required: true
        schema:
          type: string
      - name: scope
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Assignment removed
        '401':
          description: No/invalid token
        '403':
          description: Admin only
        '404':
          description: No such assignment
        '503':
          description: No store configured
      security:
      - bearer: []
  /api/v1/access/roles:
    get:
      tags:
      - access
      summary: 'Effective role mappings for the access page. Admin-only. v1 is

        read-only: with an OIDC validator the mappings come from the auth

        config file; without one (local auth) `mappings` is null and roles are

        managed per-user via `/api/v1/auth/users`.'
      operationId: list_roles
      responses:
        '200':
          description: Role mappings and their source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 access-control surface (api-v1.md \xA72.2)"
      security:
      - bearer: []
  /api/v1/audit:
    get:
      tags:
      - audit
      summary: "List the persisted audit trail, Admin/Auditor-only (api-v1.md \xA7\
        5.9)."
      operationId: list_audit_events
      parameters:
      - name: limit
        in: query
        description: Page size (default 100, max 1000).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: cursor
        in: query
        description: 'Only rows with `seq` strictly before this value (from a previous

          response''s `next_cursor`).'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: from
        in: query
        description: Window start, unix seconds (inclusive).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: to
        in: query
        description: Window end, unix seconds (inclusive).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: subject
        in: query
        description: Exact subject match.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: cluster
        in: query
        description: Exact cluster id match.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: method
        in: query
        description: Exact HTTP method match (e.g. `POST`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: path_prefix
        in: query
        description: Rows whose path starts with this prefix.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: min_status
        in: query
        description: Only rows with `status` >= this (status-less rows excluded).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: decision
        in: query
        description: '`allow` or `deny`.'
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuditDecision'
      - name: reason
        in: query
        description: Exact reason match (e.g. `insufficient_permission`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: format
        in: query
        description: '`csv` exports the page as `text/csv`; anything else is a 400.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Audit events, newest first. `?format=csv` returns text/csv
            instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '400':
          description: Bad query (e.g. from > to, unknown format)
        '401':
          description: No/invalid token
        '403':
          description: "Admin or Auditor only \u2014 audit subjects are Admin data"
      security:
      - bearer: []
  /api/v1/audit/verify:
    get:
      tags:
      - audit
      summary: Replay the audit hash chain over a window, Admin/Auditor-only (#59).
      operationId: verify_audit_trail
      parameters:
      - name: from_seq
        in: query
        description: "First `seq` to check (default 1 \u2014 the whole trail from\
          \ genesis).\nThe window chains from the newest preceding row's stored hash,\
          \ so a\nmid-trail window verifies against the same head it was written with."
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: limit
        in: query
        description: 'Max rows to replay (default 100_000, clamped to 1_000_000).
          Trails

          larger than one window verify in successive `from_seq` windows.'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Chain replay result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
        '401':
          description: No/invalid token
        '403':
          description: Admin or Auditor only
      security:
      - bearer: []
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 'Username/password login (ADR-0011). Public (allowlisted); rate-limited

        by bcrypt cost and the 5-strikes/5-minute account lockout.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Logged in; opaque bearer token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials (identical body for unknown user, wrong
            password, locked, or disabled)
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: "Log out: if the caller authenticated with a PAT, revoke it; otherwise\
        \ a\n204 no-op (JWTs are stateless \u2014 there is nothing server-side to\
        \ kill)."
      operationId: logout
      responses:
        '204':
          description: Logged out (PAT revoked when one was used)
        '401':
          description: No/invalid token
      security:
      - bearer: []
  /api/v1/auth/providers:
    get:
      tags:
      - auth
      summary: 'Login-page metadata: which providers are configured. Public by design.'
      operationId: providers
      responses:
        '200':
          description: Configured auth providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
  /api/v1/auth/tokens:
    get:
      tags:
      - auth
      summary: List the caller's own tokens. Hashes are never serialized.
      operationId: list_tokens
      responses:
        '200':
          description: The caller's tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenView'
        '401':
          description: No/invalid token
      security:
      - bearer: []
    post:
      tags:
      - auth
      summary: 'Mint a personal access token for the caller (ADR-0011). Any

        authenticated identity; the plaintext is shown once.'
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
        required: true
      responses:
        '201':
          description: Token created; plaintext returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
        '400':
          description: expires_in_days out of range
        '401':
          description: No/invalid token
      security:
      - bearer: []
  /api/v1/auth/tokens/{prefix}:
    delete:
      tags:
      - auth
      summary: "Revoke one of the caller's own tokens. Someone else's token (or a\n\
        nonexistent prefix) is a 404 \u2014 ownership can't be probed."
      operationId: revoke_token
      parameters:
      - name: prefix
        in: path
        description: The token's 8-char lookup prefix
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked
        '401':
          description: No/invalid token
        '404':
          description: No such token for this caller
      security:
      - bearer: []
  /api/v1/auth/users:
    get:
      tags:
      - auth
      summary: 'List all local users. Admin-only; hashes never serialize

        ([`LocalUserView`]).'
      operationId: list_users
      responses:
        '200':
          description: All local users, ordered by username
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocalUserView'
        '401':
          description: No/invalid token
        '403':
          description: Admin only
      security:
      - bearer: []
    post:
      tags:
      - auth
      summary: 'Create a local user. Admin-only. 201 with the wire-safe view; 400
        on a

        bad username/short password; 409 when the username is taken.'
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalUserView'
        '400':
          description: Invalid username (RFC 1123) or password under 8 chars
        '401':
          description: No/invalid token
        '403':
          description: Admin only
        '409':
          description: Username already taken
      security:
      - bearer: []
  /api/v1/auth/users/{username}:
    put:
      tags:
      - auth
      summary: 'Update a local user: role, disabled flag, and/or password. Admin-only;

        404 for an unknown user. Changing your OWN role/disabled is allowed in

        v0 (no footgun guard) but is audit-logged loudly.'
      operationId: update_user
      parameters:
      - name: username
        in: path
        description: The local user's username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalUserView'
        '400':
          description: Password under 8 chars
        '401':
          description: No/invalid token
        '403':
          description: Admin only
        '404':
          description: No such user
      security:
      - bearer: []
  /api/v1/clusters:
    get:
      tags:
      - clusters
      operationId: list_clusters
      responses:
        '200':
          description: All managed clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
      security:
      - bearer: []
    post:
      tags:
      - clusters
      operationId: create_cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCluster'
        required: true
      responses:
        '201':
          description: Desired state recorded; reconciler will converge
        '400':
          description: Invalid spec (bad quantity, min>max), or GPU tenant-isolation
            violation (fractional GPU in a multi-tenant pool)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on cluster (Operator/Admin only)
        '409':
          description: Project quota exceeded
        '500':
          description: Store/quota-accounting failure
      security:
      - bearer: []
  /api/v1/clusters/{id}:
    get:
      tags:
      - clusters
      operationId: get_cluster
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
        '404':
          description: No such cluster
      security:
      - bearer: []
    delete:
      tags:
      - clusters
      operationId: delete_cluster
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      - name: purge
        in: query
        description: Hard-delete the store row (tombstone purge); only when already
          terminated and observed gone
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 'Tombstone purged (purge=true): store row removed'
        '202':
          description: Marked for termination; reconciler tears it down
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on cluster (Operator/Admin only)
        '404':
          description: No such cluster
        '409':
          description: 'Purge refused: cluster is not a terminated/gone tombstone'
      security:
      - bearer: []
  /api/v1/clusters/{id}/events:
    get:
      tags:
      - clusters
      operationId: cluster_events
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Kubernetes Events for the cluster's objects, newest first (capped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterEvents'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
        '404':
          description: No such cluster, or the backend exposes no events
        '503':
          description: The event source (Kubernetes) could not be reached
      security:
      - bearer: []
  /api/v1/clusters/{id}/jobs:
    get:
      tags:
      - clusters
      operationId: cluster_jobs
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Normalized list of Ray jobs on the cluster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RayJobSummary'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on job
        '404':
          description: No such cluster, or no reachable Ray endpoint for it
        '503':
          description: The cluster's Ray Job API could not be reached
      security:
      - bearer: []
  /api/v1/clusters/{id}/logs:
    get:
      tags:
      - clusters
      operationId: cluster_logs
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      - name: node
        in: query
        description: Pod to tail (one of the cluster's pods); defaults to the head
          pod.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: tail
        in: query
        description: Number of trailing lines to return (default 200, capped at 5000).
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      responses:
        '200':
          description: Recent (tail-capped) pod logs plus the list of tailable pods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterLogs'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
        '404':
          description: No such cluster/pod, or the backend exposes no logs
        '503':
          description: The log source (Kubernetes) could not be reached
      security:
      - bearer: []
  /api/v1/clusters/{id}/metrics:
    get:
      tags:
      - clusters
      operationId: cluster_metrics
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Normalized cluster resource-usage summary (CPU/GPU/mem used
            vs total + node counts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterMetrics'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
        '404':
          description: No such cluster, or no reachable Ray dashboard for it
        '503':
          description: The cluster's Ray dashboard could not be reached
      security:
      - bearer: []
  /api/v1/clusters/{id}/nodes:
    get:
      tags:
      - clusters
      operationId: cluster_nodes
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Head + per-worker-group node breakdown, sourced from Kubernetes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNodes'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
        '404':
          description: No such cluster, or the backend exposes no node breakdown
        '503':
          description: The node source (Kubernetes) could not be reached
      security:
      - bearer: []
  /api/v1/clusters/{id}/resume:
    post:
      tags:
      - clusters
      operationId: resume_cluster
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Desired state set back to running; reconciler re-provisions
            (suspend=false)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on cluster (Operator/Admin only)
        '404':
          description: No such cluster
        '409':
          description: Illegal state transition, or the cluster's project is queue-assigned
            (Kueue owns suspend)
      security:
      - bearer: []
  /api/v1/clusters/{id}/suspend:
    post:
      tags:
      - clusters
      operationId: suspend_cluster
      parameters:
      - name: id
        in: path
        description: Cluster id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Desired state set to suspended; reconciler releases compute
            (spec.suspend=true)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on cluster (Operator/Admin only)
        '404':
          description: No such cluster
        '409':
          description: Illegal state transition, or the cluster's project is queue-assigned
            (Kueue owns suspend)
      security:
      - bearer: []
  /api/v1/identity:
    get:
      tags:
      - access
      summary: '"Who am I": the resolved identity for any authenticated caller. In
        dev

        mode (no validator AND no local auth) the auth middleware attaches no

        identity, and this returns the specced dev identity so the

        unauthenticated dev loop renders the full console.'
      operationId: identity
      responses:
        '200':
          description: The caller's identity (the dev identity when auth is disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          description: No/invalid token (only when auth is configured)
      security:
      - bearer: []
  /api/v1/jobs:
    get:
      tags:
      - jobs
      operationId: list_jobs
      responses:
        '200':
          description: Persistent job history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on job
      security:
      - bearer: []
  /api/v1/metrics:
    get:
      tags:
      - usage
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition of usage and control-plane gauges
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
      security:
      - bearer: []
  /api/v1/pools:
    get:
      tags:
      - pools
      operationId: list_pools
      responses:
        '200':
          description: All capacity pools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoolView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
      security:
      - bearer: []
    post:
      tags:
      - pools
      operationId: create_pool
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePool'
        required: true
      responses:
        '201':
          description: Pool created
        '400':
          description: Invalid spec (bad name, no flavors, unparseable quantity)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on pool (Admin only)
        '409':
          description: Pool already exists (create-only in v0; spec update lands with
            a later PATCH)
      security:
      - bearer: []
  /api/v1/pools/{name}:
    get:
      tags:
      - pools
      operationId: get_pool
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
        '404':
          description: No such pool
      security:
      - bearer: []
    delete:
      tags:
      - pools
      operationId: delete_pool
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Pool deleted
        '401':
          description: No/invalid token
        '403':
          description: Missing Delete on pool (Admin only)
        '404':
          description: No such pool
      security:
      - bearer: []
  /api/v1/pools/{name}/allocations:
    get:
      tags:
      - pools
      operationId: list_allocations
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The pool's allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllocationSpec'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
      security:
      - bearer: []
  /api/v1/pools/{name}/allocations/{project}:
    put:
      tags:
      - pools
      operationId: put_allocation
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAllocation'
        required: true
      responses:
        '200':
          description: Allocation recorded
        '400':
          description: Invalid allocation, body pool/project mismatches the path,
            or GPU tenant-isolation violation (time-slice pool shared by >1 project)
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on pool (Admin only)
        '404':
          description: No such pool
      security:
      - bearer: []
    delete:
      tags:
      - pools
      operationId: delete_allocation
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Allocation deleted
        '401':
          description: No/invalid token
        '403':
          description: Missing Delete on pool (Admin only)
        '404':
          description: No such allocation
      security:
      - bearer: []
  /api/v1/pools/{name}/usage:
    get:
      tags:
      - pools
      operationId: pool_usage
      parameters:
      - name: name
        in: path
        description: Pool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Live pool utilization (latest observation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolUsageView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on pool
        '404':
          description: No such pool
      security:
      - bearer: []
  /api/v1/registry/clusters:
    get:
      tags:
      - registry
      operationId: list_registry
      responses:
        '200':
          description: The gateway's routing table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistryEntryView'
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 the registry is the credential-routing table"
      security:
      - bearer: []
  /api/v1/services:
    get:
      tags:
      - services
      operationId: list_services
      responses:
        '200':
          description: All managed services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on service
      security:
      - bearer: []
    post:
      tags:
      - services
      operationId: deploy_service
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployService'
        required: true
      responses:
        '202':
          description: Deploy accepted; KubeRay rolls it out
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on service (Developer/Admin only)
        '502':
          description: Service backend error
      security:
      - bearer: []
  /api/v1/services/{name}:
    get:
      tags:
      - services
      operationId: get_service
      parameters:
      - name: name
        in: path
        description: Service name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on service
        '404':
          description: No such service
      security:
      - bearer: []
    delete:
      tags:
      - services
      operationId: delete_service
      parameters:
      - name: name
        in: path
        description: Service name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Teardown accepted
        '401':
          description: No/invalid token
        '403':
          description: Missing Write on service (Developer/Admin only)
      security:
      - bearer: []
  /api/v1/settings/policy:
    get:
      tags:
      - settings
      summary: "The effective governance policy. Admin-only: quotas and prices are\n\
        platform configuration (api-v1.md \xA72.2), classified with `Target::Cluster`\n\
        like the registry/audit surfaces."
      operationId: get_policy
      responses:
        '200':
          description: The effective policy and its provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyView'
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 governance is platform configuration"
      security:
      - bearer: []
    put:
      tags:
      - settings
      summary: "Replace sections of the governance policy. Admin-only. Edits take\
        \ effect\non the very next request \u2014 quota admission, cost estimates,\
        \ and the usage\nroll-up all read the store per request. Emits an `update_policy`\
        \ audit\nevent on success."
      operationId: update_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicy'
        required: true
      responses:
        '200':
          description: The policy after the update (source is now "store")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyView'
        '400':
          description: Negative or non-finite price/quota value
        '401':
          description: No/invalid token
        '403':
          description: "Admin only \u2014 governance is platform configuration"
      security:
      - bearer: []
  /api/v1/usage:
    get:
      tags:
      - usage
      operationId: usage_report
      parameters:
      - name: project
        in: query
        description: Filter to one project.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: pool
        in: query
        description: Filter to one pool.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: from
        in: query
        description: 'Window start, unix seconds (default: `to - 86400`).'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: to
        in: query
        description: 'Window end, unix seconds (default: now).'
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      responses:
        '200':
          description: Resource-hours (and cost when priced) by project and pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          description: from must be before to
        '401':
          description: No/invalid token
        '403':
          description: Missing Read on cluster
      security:
      - bearer: []
  /api/v1/version:
    get:
      tags:
      - system
      summary: Control-plane identity and version.
      operationId: version
      responses:
        '200':
          description: Name and semver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /healthz:
    get:
      tags:
      - system
      summary: Liveness/readiness probe.
      operationId: healthz
      responses:
        '200':
          description: Control plane is up
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    AllocationSpec:
      type: object
      description: 'A project''s allocation within a pool (translates to a Kueue LocalQueue).


        `nominal` / `borrowing_limit` / `lending_limit` are reserved for a future

        per-project ClusterQueue layout (ADR-0010): in the v0 layout all

        allocations in a pool share one ClusterQueue, so these are recorded as

        LocalQueue annotations rather than enforced quotas.'
      required:
      - pool
      - project
      - namespace
      - nominal
      - borrowing_limit
      - lending_limit
      properties:
        borrowing_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        lending_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        namespace:
          type: string
        nominal:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pool:
          type: string
        project:
          type: string
    ApiTokenView:
      type: object
      description: "The public projection of an API token \u2014 no hash, no plaintext."
      required:
      - prefix
      - username
      - label
      - created_at
      - expires_at
      - revoked
      properties:
        created_at:
          type: integer
          format: int64
          minimum: 0
        expires_at:
          type: integer
          format: int64
          minimum: 0
        label:
          type: string
        last_used_at:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        prefix:
          type: string
        revoked:
          type: boolean
        username:
          type: string
    AssignmentView:
      type: object
      description: One assignment as the wire sees it.
      required:
      - principal
      - role
      - scope
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
          description: Unix seconds when the assignment was first written.
          minimum: 0
        principal:
          type: string
          description: "The principal the assignment applies to: a token `sub` (opaque\n\
            Keycloak UUID) or a `preferred_username` \u2014 evaluation matches BOTH,\
            \ so\nhuman-friendly username grants take effect (#88)."
        role:
          type: string
          description: '"viewer" | "developer" | "operator" | "admin".'
        scope:
          type: string
          description: '"*" (global) or "project:<name>".'
    AuditDecision:
      type: string
      description: 'Whether Mobula allowed or refused the thing the event describes.

        Serialized snake_case (`allow` / `deny`).'
      enum:
      - allow
      - deny
    AuditEvent:
      type: object
      description: "One audit-trail row (api-v1.md \xA75.9). Fields not applicable\
        \ to the\nemitting site are `None` (serialized `null`); `granted_roles` is\
        \ empty.\n\nDecision policy (mobula-api `audit` module): `deny` rows are emitted\
        \ at\nthe point of refusal (authn failures, authz denials, quota denials);\n\
        gateway per-request rows are always `allow` \u2014 a request Mobula refuses\n\
        never reaches the gateway, so its `deny` row comes from the refuser."
      required:
      - ts
      - decision
      properties:
        action:
          type:
          - string
          - 'null'
          description: "Control-plane mutation (`create_cluster`, `delete_pool`, \u2026\
            );\n`null` on gateway rows."
        cluster:
          type:
          - string
          - 'null'
          description: Cluster id the event concerns; `null` when not cluster-scoped.
        decision:
          $ref: '#/components/schemas/AuditDecision'
        granted_roles:
          type: array
          items:
            type: string
          description: Roles the caller held (snake_case); authz denials only, else
            `[]`.
        latency_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Gateway upstream round-trip; `null` elsewhere.
          minimum: 0
        method:
          type:
          - string
          - 'null'
          description: HTTP method, for gateway and authn/ext_authz rows.
        path:
          type:
          - string
          - 'null'
          description: Request path (no query string).
        reason:
          type:
          - string
          - 'null'
          description: 'Machine-readable refusal reason (`missing_token`, `invalid_token`,

            `insufficient_permission`, `quota_exceeded`); `null` on allows.'
        required:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuditRequired'
            description: The permission an authz denial was checked against.
        status:
          type:
          - integer
          - 'null'
          format: int32
          description: HTTP status of the outcome, when one is known.
          minimum: 0
        subject:
          type:
          - string
          - 'null'
          description: Authenticated subject; `null` for authn failures (no identity
            yet).
        ts:
          type: integer
          format: int64
          description: Unix seconds.
          minimum: 0
    AuditListResponse:
      type: object
      description: "Response of `GET /api/v1/audit`. This endpoint is the ONE list\
        \ route\nthat wraps its items in an envelope \u2014 the cursor has to live\
        \ somewhere\n(api-v1.md \xA75.9)."
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type:
          - integer
          - 'null'
          format: int64
          description: Pass as `cursor` for the next (older) page; `null` at the end.
          minimum: 0
    AuditRequired:
      type: object
      description: "The (verb, target) permission an authorization decision was checked\n\
        against \u2014 mirrors `mobula_auth::{PermissionType, Target}` as lowercase\n\
        strings (`\"write\"`, `\"cluster\"`) so core stays free of auth types.\nPresent\
        \ only on authz denials."
      required:
      - action
      - target
      properties:
        action:
          type: string
          description: e.g. "read" | "write" | "delete" | "admin".
        target:
          type: string
          description: e.g. "job" | "cluster" | "service" | "pool".
    AuditVerifyResponse:
      type: object
      description: Response of `GET /api/v1/audit/verify`.
      required:
      - ok
      - events_checked
      properties:
        events_checked:
          type: integer
          format: int64
          description: 'Rows that verified before the replay stopped (the whole window
            on

            success; the rows before the broken one on failure).'
          minimum: 0
        first_broken_seq:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Seq of the first row whose stored `chain_hash` doesn''t match
            the

            replay; `null` when the window verifies clean.'
          minimum: 0
        ok:
          type: boolean
          description: True when every row in the window matched the replayed chain.
    ClusterEvent:
      type: object
      description: "One normalized Kubernetes Event about a cluster object (api-v1.md\
        \ \xA75.8).\nFields are `Option` because the two Event schemas (core/v1 and\n\
        events.k8s.io/v1) name them differently and any of them may be absent."
      required:
      - type
      - count
      properties:
        count:
          type: integer
          format: int32
          description: 'How many times this event has fired (K8s collapses repeats).
            Defaults

            to 1 when the source records no count.'
          minimum: 0
        first_seen:
          type:
          - string
          - 'null'
          description: First occurrence (RFC3339); `None` when the source omits it.
        last_seen:
          type:
          - string
          - 'null'
          description: Most recent occurrence (RFC3339); the field the list is sorted
            by.
        message:
          type:
          - string
          - 'null'
          description: Human-readable message.
        object:
          type:
          - string
          - 'null'
          description: The object the event is about, as `Kind/name` (e.g. `Pod/foo-head-abc`).
        reason:
          type:
          - string
          - 'null'
          description: "Short machine reason (`FailedScheduling`, `Pulled`, `BackOff`,\
            \ \u2026)."
        type:
          type: string
          description: 'Event severity: `Normal` or `Warning` (verbatim from `type`).'
    ClusterEvents:
      type: object
      description: "Kubernetes Events for one cluster's objects (api-v1.md \xA75.8),\
        \ newest first\nand capped \u2014 the body of `GET /api/v1/clusters/{id}/events`."
      required:
      - cluster_id
      - events
      properties:
        cluster_id:
          type: string
          description: The cluster id (RayCluster name).
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClusterEvent'
          description: Normalized events, most-recent-first, capped (see the endpoint's
            cap).
    ClusterLogs:
      type: object
      description: "A tail-capped pod log view for one cluster (api-v1.md \xA75.6,\
        \ non-streaming\nfirst cut) \u2014 the body of `GET /api/v1/clusters/{id}/logs`.\
        \ WS streaming is\nthe eventual design (Milestone C); this GET-tail form removes\
        \ the\npending-backend stub now."
      required:
      - cluster_id
      - pods
      - pod
      - tail
      - lines
      - truncated
      properties:
        cluster_id:
          type: string
          description: The cluster id (RayCluster name).
        lines:
          type: array
          items:
            type: string
          description: The most recent log lines (up to `tail`), oldest first.
        pod:
          type: string
          description: 'The pod these `lines` are from (the requested pod, or the
            head pod when

            none was requested). Empty only when the cluster has no pods yet.'
        pods:
          type: array
          items:
            type: string
          description: 'Names of the cluster''s pods the caller may tail (head first),
            so the UI

            can offer a pod selector.'
        tail:
          type: integer
          format: int32
          description: The tail line count that was requested.
          minimum: 0
        truncated:
          type: boolean
          description: '`true` when the tail was filled (there may be older lines
            beyond it).'
    ClusterMetrics:
      type: object
      description: "Normalized cluster resource-usage summary (the body of\n`GET /api/v1/clusters/{id}/metrics`),\
        \ distilled from the Ray dashboard's\nautoscaler / load-metrics report. Every\
        \ stat is `Option` because a cluster\nmay not report GPUs, and an older/mismatched\
        \ Ray may omit a field \u2014 the UI\nrenders a tile only for the stats present."
      required:
      - cluster_id
      properties:
        active_nodes:
          type:
          - integer
          - 'null'
          format: int64
          description: Active Ray nodes the autoscaler reports; `None` when unavailable.
          minimum: 0
        cluster_id:
          type: string
          description: The cluster id (RayCluster name).
        cpu:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourceStat'
            description: CPU cores used vs total across the Ray cluster.
        failed_nodes:
          type:
          - integer
          - 'null'
          format: int64
          description: Nodes the autoscaler marked failed; `None` when unavailable.
          minimum: 0
        gpu:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourceStat'
            description: GPU devices used vs total.
        memory:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourceStat'
            description: Memory bytes used vs total.
        object_store_memory:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourceStat'
            description: Object-store memory bytes used vs total.
        pending_nodes:
          type:
          - integer
          - 'null'
          format: int64
          description: Nodes pending launch; `None` when unavailable.
          minimum: 0
    ClusterNodes:
      type: object
      description: "Head + per-worker-group node breakdown for one cluster (api-v1.md\
        \ \xA75.3),\nthe body of `GET /api/v1/clusters/{id}/nodes`."
      required:
      - cluster_id
      - worker_groups
      properties:
        cluster_id:
          type: string
          description: The cluster id (RayCluster name).
        head:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeView'
            description: The head node; `None` if KubeRay has not created the head
              pod yet.
        worker_groups:
          type: array
          items:
            $ref: '#/components/schemas/WorkerGroupNodes'
          description: One entry per worker group, in the RayCluster spec's order.
    ClusterSpec:
      type: object
      description: 'Declarative spec for a managed cluster.


        Historically Ray-only (fields mirror a RayCluster CR so the KubeRay

        provisioner stays a thin translation). Multi-engine adds [`Self::engine`];

        the head/scheduler + worker-group shape is generic to both engines. For

        `engine = dask`, `ray_version` is unused (Dask''s version is carried by

        [`Self::image`]); it stays a required field only for back-compat with

        stored Ray specs and existing clients.'
      required:
      - name
      - project
      - ray_version
      - image
      - head_cpu
      - head_memory
      - worker_groups
      properties:
        engine:
          $ref: '#/components/schemas/Engine'
          description: 'Which compute engine backs this cluster. `#[serde(default)]`
            = Ray, so

            every pre-multi-engine spec and every Ray client keeps working

            untouched.'
        head_cpu:
          type: string
        head_memory:
          type: string
        idle_timeout_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: "**Inactivity reap window** in seconds (#100): the cluster\
            \ is reaped once\nit has been *idle* \u2014 no job activity \u2014 for\
            \ this long, so a busy cluster\nsurvives past it while a genuinely unused\
            \ one is released. Distinct from\n[`Self::ttl_seconds`], which still caps\
            \ absolute age independently:\nwhichever fires first reaps the cluster.\n\
            \nActivity is derived from the persisted job history (a running/recent\n\
            gateway job keeps the cluster alive). **Limitation:** interactive Ray\n\
            Client / Dask sessions submit no gateway jobs, so their activity is\n\
            invisible to this signal \u2014 an interactive-only cluster looks idle\
            \ from\ncreation. For such sessions rely on [`Self::ttl_seconds`] or leave\
            \ this\nunset. See `reconcile.rs` module docs.\n\n`#[serde(default)]`\
            \ so specs persisted before this field \u2014 and any\nclient that omits\
            \ it \u2014 keep the prior max-age-only behavior."
          minimum: 0
        image:
          type: string
        name:
          type: string
        owner:
          type:
          - string
          - 'null'
          description: "The authenticated owner of this cluster (tier-2 owned session\n\
            clusters): the human identity that requested it \u2014 a\n`preferred_username`\
            \ when the OIDC token carries one, else the `sub`.\nSet control-plane-side\
            \ from the request identity (never trusted from\nthe client body); `None`\
            \ for clusters created without an owner (e.g.\nadmin/service paths). When\
            \ set it is stamped as the\n`mobula.dev/owner` label on the RayCluster\
            \ and its pods, and drives\nthe per-owner Ray-client (`:10001`) ingress\
            \ NetworkPolicy so only the\nowner's notebook pod can reach the cluster.\
            \ `#[serde(default)]` keeps\nspecs persisted before this field deserializable\
            \ (they parse as\n`None`)."
        project:
          type: string
        ray_version:
          type: string
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: "**Absolute max-age cap** in seconds: the cluster is reaped\
            \ this long\nafter creation regardless of activity. `None` disables the\
            \ max-age\nreaper. (Despite the historical name, this is a wall-clock\
            \ age cap, not\nan inactivity window \u2014 see [`Self::idle_timeout_secs`]\
            \ for that.)"
          minimum: 0
        worker_groups:
          type: array
          items:
            $ref: '#/components/schemas/WorkerGroup'
    ClusterState:
      type: string
      description: "Lifecycle states of a managed cluster (PLAN.md \xA73.1)."
      enum:
      - pending
      - provisioning
      - running
      - degraded
      - updating
      - suspending
      - suspended
      - terminating
      - terminated
    ClusterView:
      type: object
      description: 'A cluster as the control plane sees it: desired spec metadata
        plus the

        last observed state (reconstructed from the provisioner, ADR-0006).'
      required:
      - id
      - generation
      - desired
      - observed_generation
      - project
      - engine
      - ray_version
      properties:
        condition:
          type:
          - string
          - 'null'
          description: 'Drift/health alarm raised by the reconcile engine (ADR-0004,
            #41/#47):

            "spec_drift" (out-of-band edit) or "degraded". `None` when converging

            normally. Distinct from `observed_state`.'
        desired:
          type: string
          description: "\"running\" | \"suspended\" | \"terminated\" \u2014 the operator's\
            \ intent."
        engine:
          type: string
          description: 'Which engine backs this cluster: "ray" | "dask" (multi-engine).
            Lets

            GET /clusters surface a Ray and a Dask cluster side by side.'
        est_max_hourly:
          type:
          - number
          - 'null'
          format: double
          description: Estimated $/hr at max (fully scaled) size.
        est_min_hourly:
          type:
          - number
          - 'null'
          format: double
          description: Estimated $/hr at min size, if a price sheet is configured.
        generation:
          type: integer
          format: int64
          description: Bumps when the spec changes; drives the reconcile idempotency
            key.
          minimum: 0
        id:
          type: string
        observed_generation:
          type: integer
          format: int64
          minimum: 0
        observed_state:
          type:
          - string
          - 'null'
          description: Observed lifecycle state, if the cluster has been reconciled.
        project:
          type: string
        ray_version:
          type: string
    CreateCluster:
      type: object
      description: Request body for creating/updating a managed cluster.
      required:
      - id
      - spec
      properties:
        id:
          type: string
          description: Stable cluster id (also the gateway routing key / RayCluster
            name).
        spec:
          $ref: '#/components/schemas/ClusterSpec'
    CreatePool:
      type: object
      description: Request body for creating a pool.
      required:
      - spec
      properties:
        spec:
          $ref: '#/components/schemas/PoolSpec'
    CreateTokenRequest:
      type: object
      required:
      - label
      - expires_in_days
      properties:
        expires_in_days:
          type: integer
          format: int64
          description: Lifetime in days; capped at the server maximum (90).
          minimum: 0
        label:
          type: string
          description: "Human label (\"ci\", \"laptop\") \u2014 shown in listings."
    CreateTokenResponse:
      type: object
      description: "`POST /api/v1/auth/tokens` success body. The plaintext `token`\
        \ is\nreturned ONLY here \u2014 store it now; it cannot be recovered."
      required:
      - prefix
      - token
      - expires_at
      properties:
        expires_at:
          type: integer
          format: int64
          description: Unix seconds.
          minimum: 0
        prefix:
          type: string
        token:
          type: string
    CreateUserRequest:
      type: object
      required:
      - username
      - password
      - role
      properties:
        email:
          type:
          - string
          - 'null'
        password:
          type: string
          description: 'Minimum 8 characters; bcrypt-hashed at rest, never stored
            or

            returned in plaintext.'
        role:
          $ref: '#/components/schemas/LocalRole'
        username:
          type: string
          description: RFC 1123 subdomain (k8s-name-safe); unique.
    DeployService:
      type: object
      description: Request body to deploy or update a service.
      required:
      - name
      - spec
      properties:
        name:
          type: string
          description: Stable service name (the RayService name).
        spec:
          $ref: '#/components/schemas/ServiceSpec'
    Engine:
      type: string
      description: "The compute engine a cluster is provisioned on (multi-engine spike).\
        \ The\ncontrol plane is engine-neutral above the provisioner seam; this\n\
        discriminator is what the reconciler and the provisioner router dispatch\n\
        on. `Ray` is the default so specs persisted before multi-engine \u2014 and\
        \ any\nclient that omits the field \u2014 still deserialize as Ray clusters,\
        \ exactly\nas before."
      enum:
      - ray
      - dask
    FlavorSpec:
      type: object
      description: 'A hardware flavor within a pool: node selection plus per-resource

        nominal quota (K8s quantity strings, e.g. "4", "512Gi").'
      required:
      - name
      - resources
      - node_labels
      - taints
      properties:
        name:
          type: string
        node_labels:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        resources:
          type: object
          description: "Resource key \u2192 nominal quota quantity string."
          additionalProperties:
            type: string
          propertyNames:
            type: string
        taints:
          type: array
          items:
            $ref: '#/components/schemas/TaintSpec'
    GpuSharing:
      type: string
      description: "How a pool's GPUs may be shared between workloads (#58).\n\nNVIDIA\
        \ GPU time-slicing (and fractional `nvidia.com/gpu` requests via the\ndevice\
        \ plugin) shares one GPU's SMs across processes with no hardware\nisolation\
        \ \u2014 acceptable within one tenant, never across tenants. MIG is\nhardware\
        \ partitioning and whole-GPU allocation needs no sharing at all,\nso both\
        \ are isolation-safe. The tenant-isolation rule itself is enforced\nby `mobula-policy::gpu`\
        \ at admission time; this field is the per-pool\nknob it evaluates."
      enum:
      - whole-gpu
      - mig
      - time-slice
    IdentityResponse:
      type: object
      description: '`GET /api/v1/identity` response: the caller''s resolved identity.'
      required:
      - subject
      - groups
      - roles
      properties:
        email:
          type:
          - string
          - 'null'
        groups:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
          description: Snake_case role names ("viewer", "developer", "operator", "admin").
        subject:
          type: string
    JobView:
      type: object
      description: "A job in the persistent, cross-cluster history (Phase 3, spec\
        \ \xA75.5)."
      required:
      - id
      - cluster
      - submitter
      - status
      - submitted_at
      properties:
        cluster:
          type: string
        duration_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: Wall-clock seconds once terminal; null while running.
          minimum: 0
        id:
          type: string
        status:
          type: string
          description: Ray job status (PENDING | RUNNING | SUCCEEDED | FAILED | STOPPED).
        submitted_at:
          type: integer
          format: int64
          minimum: 0
        submitter:
          type: string
    LocalRole:
      type: string
      description: "A local user's role (ADR-0011: roles are a column on the user,\
        \ resolved\nper request \u2014 no claim staleness). Stored as TEXT in `local_users.role`;\n\
        the vocabulary mirrors `mobula_auth::Role` (kept as a separate enum so\ncore\
        \ never depends on the auth crate)."
      enum:
      - viewer
      - developer
      - operator
      - admin
      - auditor
    LocalUserView:
      type: object
      description: "The public projection of a local user \u2014 everything EXCEPT\
        \ the password\nhash and the lockout internals that are nobody else's business."
      required:
      - username
      - role
      - disabled
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
          minimum: 0
        disabled:
          type: boolean
        email:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/LocalRole'
        username:
          type: string
    LoginIdentity:
      type: object
      description: The identity half of a login response.
      required:
      - subject
      - roles
      properties:
        roles:
          type: array
          items:
            type: string
        subject:
          type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        username:
          type: string
    LoginResponse:
      type: object
      description: "`POST /api/v1/auth/login` success body. `token` is an opaque\n\
        `mob_\u2026` bearer credential (ADR-0011: stored, never signed)."
      required:
      - token
      - token_type
      - expires_at
      - identity
      properties:
        expires_at:
          type: integer
          format: int64
          description: Unix seconds after which the token no longer authenticates.
          minimum: 0
        identity:
          $ref: '#/components/schemas/LoginIdentity'
        token:
          type: string
        token_type:
          type: string
          description: Always "bearer".
          example: bearer
    NodeView:
      type: object
      description: 'A single Ray node (head or one worker) as Kubernetes sees it:
        the pod

        KubeRay created for it, its scheduling/readiness, and the compute it

        requests. Fields are `Option` because a pod may not yet be scheduled

        (no IP/host) and a quantity may be unparseable or unset.'
      required:
      - pod_name
      - is_head
      - phase
      - ready
      properties:
        cpu:
          type:
          - number
          - 'null'
          format: double
          description: "CPU cores requested, summed across the pod's containers and\
            \ parsed\nfrom the K8s quantity (`500m` \u2192 0.5). `None` when unset/unparseable."
        gpu:
          type:
          - number
          - 'null'
          format: double
          description: 'GPUs requested (`nvidia.com/gpu`), summed across containers.
            `None`

            when the pod requests no GPU.'
        group:
          type:
          - string
          - 'null'
          description: Worker-group name (`ray.io/group`); `None` for the head node.
        host:
          type:
          - string
          - 'null'
          description: 'Kubernetes node the pod landed on (`spec.nodeName`); `None`
            before

            scheduling.'
        is_head:
          type: boolean
          description: Whether this is the cluster's head node.
        memory_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: "Memory bytes requested, summed across the pod's containers\
            \ (`2Gi` \u2192\n2147483648). `None` when unset/unparseable."
          minimum: 0
        node_ip:
          type:
          - string
          - 'null'
          description: Pod IP once scheduled (`status.podIP`); `None` before scheduling.
        phase:
          type: string
          description: 'Kubernetes pod phase: `Pending` | `Running` | `Succeeded`
            | `Failed` |

            `Unknown` (verbatim from `status.phase`).'
        pod_name:
          type: string
          description: The pod's name (`metadata.name`).
        ready:
          type: boolean
          description: 'Whether the pod''s `Ready` condition is true. Distinct from
            `phase`: a

            pod can be `Running` but not yet `Ready`.'
    OidcProviderInfo:
      type: object
      required:
      - issuer
      properties:
        issuer:
          type: string
    PolicyView:
      type: object
      description: '`GET /api/v1/settings/policy` response: the effective policy plus
        its

        provenance.'
      required:
      - quotas
      - source
      - editable
      properties:
        editable:
          type: boolean
          description: "Always true in v1 \u2014 the policy is editable via PUT."
        prices:
          type:
          - object
          - 'null'
          description: "resource \u2192 $/unit-hour; `null` when no price sheet is\
            \ configured."
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        quotas:
          type: object
          description: "project \u2192 (resource \u2192 limit). Empty when no quotas\
            \ are configured."
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              format: double
            propertyNames:
              type: string
          propertyNames:
            type: string
        source:
          type: string
          description: '"file" (the untouched `--policy` boot seed) | "store" (edited
            via

            PUT) | "none" (no policy configured at all).'
          example: file
    PoolSpec:
      type: object
      description: 'A shared capacity pool: flavors + a cohort to borrow from (ADR-0010).'
      required:
      - name
      - flavors
      - cohort
      - fair_sharing_weight
      - elastic
      properties:
        cohort:
          type: string
          description: 'Name of the Kueue cohort this pool''s ClusterQueue joins for
            elastic

            borrowing.'
        elastic:
          type: boolean
          description: 'Whether workloads in this pool may be elastically resized
            (Kueue

            elastic jobs / Workload Slices).'
        fair_sharing_weight:
          type: number
          format: double
          description: Kueue `spec.fairSharing.weight` for the pool's ClusterQueue.
        flavors:
          type: array
          items:
            $ref: '#/components/schemas/FlavorSpec'
        gpu_sharing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GpuSharing'
            description: "GPU sharing mode for this pool (#58). `None` inherits the\
              \ platform\ndefault (`[gpu] default_sharing` in the policy file, itself\n\
              defaulting to `whole-gpu`). A pool shared by more than one project\n\
              may not resolve to `time-slice` \u2014 enforced at admission by\n`mobula-policy::gpu`,\
              \ not here (core validates shape; tenancy is\nknown only at the API\
              \ edge, where allocations live)."
        name:
          type: string
    PoolUsageView:
      type: object
      description: "Live point-in-time usage of one pool (Slice 4): built from the\
        \ pool's\nlatest stored ClusterQueue/LocalQueue observation plus the spec's\n\
        nominal quotas. NOT a timeseries \u2014 for history use `GET /api/v1/usage`.\n\
        `projects` is the per-LocalQueue (per-project) attribution; empty when\nthe\
        \ observation predates per-LQ status or none exists."
      required:
      - pool
      - utilization
      - projects
      properties:
        pool:
          type: string
        projects:
          type: object
          description: "project \u2192 resource \u2192 allocated quantity."
          additionalProperties:
            type: object
            additionalProperties:
              type: number
              format: double
            propertyNames:
              type: string
          propertyNames:
            type: string
        sampled_at:
          type:
          - integer
          - 'null'
          format: int64
          description: 'When the observation was recorded (unix seconds); `null` until
            the

            pool reconcile loop has observed this pool.'
          minimum: 0
        utilization:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceUtilization'
          propertyNames:
            type: string
    PoolView:
      type: object
      description: 'A pool as the control plane serves it: the stored spec metadata
        plus

        `total_nominal`, the per-resource sum of all flavors'' nominal quotas.'
      required:
      - name
      - generation
      - created_at
      - flavors
      - cohort
      - fair_sharing_weight
      - elastic
      - total_nominal
      properties:
        cohort:
          type: string
        created_at:
          type: integer
          format: int64
          minimum: 0
        elastic:
          type: boolean
        fair_sharing_weight:
          type: number
          format: double
        flavors:
          type: array
          items:
            $ref: '#/components/schemas/FlavorSpec'
        generation:
          type: integer
          format: int64
          description: Bumps when the spec changes (same convention as clusters).
          minimum: 0
        gpu_sharing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GpuSharing'
            description: 'The pool''s GPU sharing mode (#58); `null` = the platform
              default

              (`[gpu] default_sharing`, itself defaulting to `whole-gpu`).'
        name:
          type: string
        total_nominal:
          type: object
          description: "Resource key \u2192 summed nominal quota across flavors, as\
            \ a string.\nA resource key whose quantity fails to parse on ANY flavor\
            \ is\nomitted entirely (a partial sum would misreport capacity); the\n\
            failure is logged. Display math only \u2014 the spec stays authoritative."
          additionalProperties:
            type: string
          propertyNames:
            type: string
    ProvidersResponse:
      type: object
      description: "Which auth providers this deployment offers (login-page metadata;\
        \ not\nsensitive \u2014 the endpoint is public by design)."
      required:
      - local
      properties:
        local:
          type: boolean
          description: Local username/password auth is enabled (ADR-0011).
        oidc:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OidcProviderInfo'
            description: OIDC configuration, when a validator is configured.
    PutAllocation:
      type: object
      description: 'Request body for putting an allocation: `AllocationSpec` minus

        `pool`/`project`, which come from the path. If the body still carries

        them, they must match the path or the request is rejected.'
      required:
      - namespace
      - nominal
      - borrowing_limit
      - lending_limit
      properties:
        borrowing_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        lending_limit:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        namespace:
          type: string
        nominal:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pool:
          type:
          - string
          - 'null'
        project:
          type:
          - string
          - 'null'
    RayJobSummary:
      type: object
      description: "A Ray job normalized to a stable Mobula shape (api-v1.md \xA7\
        5.6). Every\nfield is optional: Ray's own records vary by version and by whether\
        \ the\njob has started/finished. `status` is Ray's vocabulary verbatim\n(`PENDING\
        \ | RUNNING | SUCCEEDED | FAILED | STOPPED`) \u2014 not snake_cased,\nper\
        \ \xA75.7. `start_time`/`end_time` are Ray's unix-millis timestamps."
      properties:
        end_time:
          type:
          - integer
          - 'null'
          format: int64
          description: Ray's `end_time` (unix millis); `None` while the job runs.
          minimum: 0
        entrypoint:
          type:
          - string
          - 'null'
        job_id:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        start_time:
          type:
          - integer
          - 'null'
          format: int64
          description: Ray's `start_time` (unix millis); `None` before the job starts.
          minimum: 0
        status:
          type:
          - string
          - 'null'
        submission_id:
          type:
          - string
          - 'null'
    RegistryEntryView:
      type: object
      description: 'A gateway routing entry as the control plane may show it: where
        a

        cluster is exposed and where its dashboard head lives, but never the

        token itself (ADR-0003, security issue #4).'
